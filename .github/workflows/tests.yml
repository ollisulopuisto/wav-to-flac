name: Conversion safety
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  conversion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install ffmpeg
            else
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
          fi
      - name: Check shell syntax and run real-audio safety tests
        run: |
          /bin/bash --version
          /bin/bash -n wav-to-flac.sh
          python3 -m unittest discover -s tests -v
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck wav-to-flac.sh
